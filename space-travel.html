<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Space Travel</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }

            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <script type="module">
            // We use a tiny helper for Matrix math to keep the code clean
            const canvas = document.getElementById('c');
            const gl = canvas.getContext('webgl');

            // --- SHIP VECTORS ---
            let shipPos = [0, 0, 0];
            let forward = [0, 0, -1];
            // Starting direction (into screen)
            let up = [0, 1, 0];
            let right = [1, 0, 0];
            let velocity = 0.2;

            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            window.onresize = resize;
            resize();

            const vs = `
  attribute vec3 a_seed;
  uniform vec3 u_shipPos;
  uniform mat4 u_viewMat; // The entire ship orientation in one matrix
  varying float v_bright;

  void main() {
    // 1. Infinite wrapping (World Space)
    vec3 p = mod(a_seed - u_shipPos, 100.0) - 50.0;

    // 2. Transform world point to Ship-Relative space using the Matrix
    vec4 relativePos = u_viewMat * vec4(p, 1.0);

    // 3. Perspective Projection (Standard 3D)
    if (relativePos.z >= -0.1) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0); 
    } else {
        float pScale = 1.0 / abs(relativePos.z);
        gl_Position = vec4(relativePos.x * pScale, relativePos.y * pScale, 0.0, 1.0);
        gl_PointSize = pScale * 40.0;
        v_bright = smoothstep(50.0, 5.0, abs(relativePos.z));
    }
  }
`;

            const fs = `
  precision mediump float;
  varying float v_bright;
  void main() {
    if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
    gl_FragColor = vec4(v_bright * 0.8, v_bright * 0.9, 1.0, 1.0);
  }
`;

            // Helper: Basic Vector Math
            const normalize = (v) => {
                const d = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
                return [v[0] / d, v[1] / d, v[2] / d];
            }
            ;
            const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

            function createShader(gl, type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                return s;
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, createShader(gl, gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog);
            gl.useProgram(prog);

            const count = 30000;
            const seeds = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++)
                seeds[i] = Math.random() * 100.0;

            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, "a_seed");
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);

            const uShip = gl.getUniformLocation(prog, "u_shipPos");
            const uView = gl.getUniformLocation(prog, "u_viewMat");

            // 1. Add this helper function to rotate a vector around an axis
            const rotate = (v, axis, angle) => {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                // Cross product (axis x v)
                const cx = axis[1] * v[2] - axis[2] * v[1];
                const cy = axis[2] * v[0] - axis[0] * v[2];
                const cz = axis[0] * v[1] - axis[1] * v[0];
            
                return [
                    v[0] * c + cx * s + axis[0] * (axis[0]*v[0] + axis[1]*v[1] + axis[2]*v[2]) * (1-c),
                    v[1] * c + cy * s + axis[1] * (axis[0]*v[0] + axis[1]*v[1] + axis[2]*v[2]) * (1-c),
                    v[2] * c + cz * s + axis[2] * (axis[0]*v[0] + axis[1]*v[1] + axis[2]*v[2]) * (1-c)
                ];
            };

            function update() {
                const turnSpeed = 0.03;
            
                // 2. STEERING: Rotate vectors around the LOCAL axes
                // Yaw: Rotate Forward and Right around Up
                if (keys['ArrowLeft']) {
                    forward = rotate(forward, up, turnSpeed);
                    right = rotate(right, up, turnSpeed);
                }
                if (keys['ArrowRight']) {
                    forward = rotate(forward, up, -turnSpeed);
                    right = rotate(right, up, -turnSpeed);
                }
                // Pitch: Rotate Forward and Up around Right
                if (keys['ArrowUp']) {
                    forward = rotate(forward, right, turnSpeed);
                    up = rotate(up, right, turnSpeed);
                }
                if (keys['ArrowDown']) {
                    forward = rotate(forward, right, -turnSpeed);
                    up = rotate(up, right, -turnSpeed);
                }
            
                // 3. CLEANUP: Normalize and Orthogonalize to prevent math errors
                forward = normalize(forward);
                // Recalculate Right to ensure it is perfectly perpendicular to Forward and Up
                right = normalize(cross(forward, up)); 
                // Recalculate Up to ensure it is perfectly perpendicular to Forward and Right
                up = normalize(cross(right, forward)); 
            
                // 4. MOVE SHIP
                let targetVel = keys['Space'] ? 2.5 : 0.3;
                targetVel = keys['ControlLeft'] ? 0 : targetVel; // Cheesey addition
                targetVel = keys['ShiftLeft'] ? targetVel * -1 : targetVel; // Another cheesey addition
                velocity += (targetVel - velocity) * 0.1;
                shipPos[0] += forward[0] * velocity;
                shipPos[1] += forward[1] * velocity;
                shipPos[2] += forward[2] * velocity;
            
                // 5. CREATE VIEW MATRIX
                const mat = [
                    right[0], up[0], -forward[0], 0,
                    right[1], up[1], -forward[1], 0,
                    right[2], up[2], -forward[2], 0,
                    0, 0, 0, 1
                ];
            
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform3fv(uShip, shipPos);
                gl.uniformMatrix4fv(uView, false, mat);
                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(update);
            }
            
            requestAnimationFrame(update);
        </script>
    </body>
</html>
